<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATE CS PYQ Hub</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  
  <!-- KaTeX Core Library (Required for auto-render to work) -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  
  <!-- KaTeX Auto-Render Extension -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gray: { 950: '#0a0a0a', 900: '#171717', 800: '#262626' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col">
  
  <!-- Root Container -->
  <div id="app" class="flex-grow flex flex-col"></div>

  <!-- Main App Logic (deferred so KaTeX loads first) -->
  <script defer src="./js/app.js"></script>
</body>
</html>
